<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
>
  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#172334"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>

    <linearGradient
      id="green"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#39ff69"/>
      <stop offset="100%" stop-color="#00b82b"/>
    </linearGradient>
  </defs>

  <!-- App background -->

  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#background)"
  />

  <!-- Calculator body -->

  <rect
    x="105"
    y="70"
    width="302"
    height="372"
    rx="48"
    fill="#111720"
    stroke="#2b3948"
    stroke-width="10"
  />

  <!-- Display -->

  <rect
    x="140"
    y="108"
    width="232"
    height="76"
    rx="18"
    fill="#050709"
  />

  <!-- Display symbol -->

  <text
    x="350"
    y="160"
    text-anchor="end"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#ffffff"
  >
    42
  </text>

  <!-- Calculator buttons -->

  <circle
    cx="165"
    cy="240"
    r="25"
    fill="#3a4654"
  />

  <circle
    cx="230"
    cy="240"
    r="25"
    fill="#3a4654"
  />

  <circle
    cx="295"
    cy="240"
    r="25"
    fill="#3a4654"
  />

  <circle
    cx="360"
    cy="240"
    r="25"
    fill="#ff9500"
  />

  <circle
    cx="165"
    cy="305"
    r="25"
    fill="#202a36"
  />

  <circle
    cx="230"
    cy="305"
    r="25"
    fill="#202a36"
  />

  <circle
    cx="295"
    cy="305"
    r="25"
    fill="#202a36"
  />

  <circle
    cx="360"
    cy="305"
    r="25"
    fill="#ff9500"
  />

  <circle
    cx="165"
    cy="370"
    r="25"
    fill="#202a36"
  />

  <circle
    cx="230"
    cy="370"
    r="25"
    fill="#202a36"
  />

  <circle
    cx="295"
    cy="370"
    r="25"
    fill="#00d632"
  />

  <circle
    cx="360"
    cy="370"
    r="25"
    fill="#00d632"
  />

  <!-- Subtle brand mark -->

  <text
    x="256"
    y="475"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="800"
    fill="url(#green)"
  >
    CALCNOVA
  </text>

</svg>
